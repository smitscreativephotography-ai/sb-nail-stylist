<!DOCTYPE html>
<html>
  <body>
    <!-- Only used so Netlify registers the form at build time. Never shown to visitors. -->
    <form name="bestelaanvraag" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="bestelaanvraag" />
      <input name="naam" />
      <input name="email" type="email" />
      <input name="telefoon" />
      <input name="set" />
      <input name="omvang" />
      <input name="lengte" />
      <input name="vorm" />
      <input name="stijl" />
      <input name="kleur" />
      <input name="budget" />
      <input name="verzending" />
      <textarea name="opmerkingen"></textarea>
      <textarea name="gesprek"></textarea>
      <input name="subject" />
      <input name="bot-field" />
    </form>
  </body>
</html>
